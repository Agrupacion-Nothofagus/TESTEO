<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Principios y áreas de acción de Agrupación Nothofagus</title>
  <desc id="desc">Diagrama con principios base a la izquierda, áreas de acción a la derecha y el símbolo institucional al centro.</desc>
  <defs>
    <linearGradient id="boxGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <linearGradient id="logoGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3d2b"/>
      <stop offset="1" stop-color="#13251b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f3d2b" flood-opacity="0.12"/>
    </filter>
    <style>
      .label-title{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:18px;font-weight:600;fill:#1f2d24}
      .node-text{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:26px;font-weight:500;fill:#111}
      .line{fill:none;stroke:#9bad9f;stroke-width:3;stroke-linecap:round}
      .node{fill:url(#boxGradient);stroke:#9bad9f;stroke-width:3}
    </style>
  </defs>

  <rect width="1100" height="430" fill="#ffffff"/>

  <text x="210" y="48" text-anchor="middle" class="label-title">Principios Base</text>
  <text x="885" y="48" text-anchor="middle" class="label-title">Áreas de Acción</text>

  <!-- Left connectors -->
  <path class="line" d="M355 84 C415 84 435 180 535 215"/>
  <path class="line" d="M335 156 C420 156 448 196 535 215"/>
  <path class="line" d="M325 226 C420 226 455 220 535 215"/>
  <path class="line" d="M340 296 C420 296 455 235 535 215"/>
  <path class="line" d="M360 366 C430 366 456 250 535 215"/>

  <!-- Right connectors -->
  <path class="line" d="M565 215 C665 180 688 84 750 84"/>
  <path class="line" d="M565 215 C655 194 688 156 770 156"/>
  <path class="line" d="M565 215 C655 220 700 226 790 226"/>
  <path class="line" d="M565 215 C650 236 688 296 775 296"/>
  <path class="line" d="M565 215 C650 252 690 366 750 366"/>

  <!-- Left nodes -->
  <rect class="node" x="84" y="60" width="282" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="70" y="134" width="284" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="58" y="208" width="280" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="70" y="282" width="284" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="106" y="356" width="270" height="54" rx="8" filter="url(#softShadow)"/>

  <text x="225" y="95" text-anchor="middle" class="node-text">Fraternidad</text>
  <text x="212" y="169" text-anchor="middle" class="node-text">Tolerancia</text>
  <text x="198" y="243" text-anchor="middle" class="node-text">Laicismo</text>
  <text x="212" y="317" text-anchor="middle" class="node-text">Libre examen</text>
  <text x="241" y="391" text-anchor="middle" class="node-text">Solidaridad social</text>

  <!-- Right nodes -->
  <rect class="node" x="748" y="60" width="282" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="770" y="134" width="270" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="790" y="208" width="270" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="775" y="282" width="284" height="54" rx="8" filter="url(#softShadow)"/>
  <rect class="node" x="750" y="356" width="270" height="54" rx="8" filter="url(#softShadow)"/>

  <text x="889" y="95" text-anchor="middle" class="node-text">Educación</text>
  <text x="905" y="169" text-anchor="middle" class="node-text">Salud</text>
  <text x="925" y="243" text-anchor="middle" class="node-text">Medio ambiente</text>
  <text x="917" y="317" text-anchor="middle" class="node-text">Cultura y artes</text>
  <text x="885" y="391" text-anchor="middle" class="node-text">Justicia y comunidad</text>

  <!-- Center mark -->
  <circle cx="550" cy="215" r="58" fill="url(#logoGradient)" filter="url(#softShadow)"/>
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 250 V175"/>
    <path d="M550 175 C532 190 530 214 550 225 C570 214 568 190 550 175Z"/>
    <path d="M548 250 C514 250 500 230 500 210 C526 211 544 224 548 250Z"/>
    <path d="M552 250 C586 250 600 230 600 210 C574 211 556 224 552 250Z"/>
    <path d="M522 240 C534 235 543 238 548 250"/>
    <path d="M578 240 C566 235 557 238 552 250"/>
  </g>
</svg>
