<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Principios y áreas de acción de Agrupación Nothofagus</title>
  <desc id="desc">Diagrama con principios base a la izquierda, áreas de acción a la derecha y el símbolo institucional al centro.</desc>
  <defs>
    <linearGradient id="nodeGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3d2b"/>
      <stop offset="1" stop-color="#13251b"/>
    </linearGradient>
    <linearGradient id="logoGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3d2b"/>
      <stop offset="1" stop-color="#13251b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f3d2b" flood-opacity="0.16"/>
    </filter>
    <style>
      .label-title{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#1f3d2b}
      .node-text{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:25px;font-weight:700;fill:#f5f1e8}
      .line{fill:none;stroke:#4f7d4a;stroke-width:3;stroke-linecap:round;opacity:.7}
      .node{fill:url(#nodeGradient);stroke:#4f7d4a;stroke-width:2.4}
    </style>
  </defs>

  <text x="210" y="48" text-anchor="middle" class="label-title">Principios Base</text>
  <text x="885" y="48" text-anchor="middle" class="label-title">Áreas de Acción</text>

  <!-- Left connectors -->
  <path class="line" d="M355 84 C420 84 438 176 512 207"/>
  <path class="line" d="M335 156 C410 156 442 192 512 207"/>
  <path class="line" d="M325 226 C410 226 448 218 512 215"/>
  <path class="line" d="M340 296 C415 296 445 238 512 224"/>
  <path class="line" d="M360 366 C425 366 450 255 512 232"/>

  <!-- Right connectors -->
  <path class="line" d="M588 207 C660 176 685 84 750 84"/>
  <path class="line" d="M588 211 C656 193 690 156 770 156"/>
  <path class="line" d="M588 215 C656 220 700 226 790 226"/>
  <path class="line" d="M588 224 C650 238 690 296 775 296"/>
  <path class="line" d="M588 232 C650 255 690 366 750 366"/>

  <!-- Left nodes -->
  <rect class="node" x="84" y="60" width="282" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="70" y="134" width="284" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="58" y="208" width="280" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="70" y="282" width="284" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="106" y="356" width="270" height="54" rx="9" filter="url(#softShadow)"/>

  <text x="225" y="95" text-anchor="middle" class="node-text">Fraternidad</text>
  <text x="212" y="169" text-anchor="middle" class="node-text">Tolerancia</text>
  <text x="198" y="243" text-anchor="middle" class="node-text">Laicismo</text>
  <text x="212" y="317" text-anchor="middle" class="node-text">Libre examen</text>
  <text x="241" y="391" text-anchor="middle" class="node-text">Solidaridad social</text>

  <!-- Right nodes -->
  <rect class="node" x="748" y="60" width="282" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="770" y="134" width="270" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="790" y="208" width="270" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="775" y="282" width="284" height="54" rx="9" filter="url(#softShadow)"/>
  <rect class="node" x="750" y="356" width="270" height="54" rx="9" filter="url(#softShadow)"/>

  <text x="889" y="95" text-anchor="middle" class="node-text">Educación</text>
  <text x="905" y="169" text-anchor="middle" class="node-text">Salud</text>
  <text x="925" y="243" text-anchor="middle" class="node-text">Medio ambiente</text>
  <text x="917" y="317" text-anchor="middle" class="node-text">Cultura y artes</text>
  <text x="885" y="391" text-anchor="middle" class="node-text">Justicia y comunidad</text>

  <!-- Center mark -->
  <circle cx="550" cy="215" r="54" fill="url(#logoGradient)" filter="url(#softShadow)"/>
  <circle cx="550" cy="215" r="54" fill="none" stroke="#4f7d4a" stroke-width="2" opacity=".55"/>
  <g fill="none" stroke="#f5f1e8" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 253 V176"/>
    <path d="M550 176 C531 192 531 217 550 228 C569 217 569 192 550 176Z"/>
    <path d="M547 252 C514 252 498 232 498 210 C527 212 544 226 547 252Z"/>
    <path d="M553 252 C586 252 602 232 602 210 C573 212 556 226 553 252Z"/>
    <path d="M520 238 C533 234 542 239 548 252"/>
    <path d="M580 238 C567 234 558 239 552 252"/>
    <path d="M510 255 H590"/>
  </g>
</svg>
