<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">Principios y áreas de acción de Agrupación Nothofagus</title>
  <desc id="desc">Diagrama con principios base a la izquierda, áreas de acción a la derecha y el símbolo institucional al centro.</desc>
  <defs>
    <linearGradient id="nodeGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#245538"/>
      <stop offset="0.52" stop-color="#123923"/>
      <stop offset="1" stop-color="#092015"/>
    </linearGradient>
    <radialGradient id="logoGradient" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#2b6440"/>
      <stop offset="0.58" stop-color="#163d28"/>
      <stop offset="1" stop-color="#071d13"/>
    </radialGradient>
    <filter id="nodeShadow" x="-20%" y="-35%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f3d2b" flood-opacity="0.20"/>
    </filter>
    <filter id="logoShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#13251b" flood-opacity="0.26"/>
    </filter>
    <style>
      .heading{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:38px;font-weight:900;fill:#13251b;letter-spacing:-.03em}
      .node-text{font-family:'Plus Jakarta Sans',Arial,Helvetica,sans-serif;font-size:30px;font-weight:900;fill:#f5f1e8;letter-spacing:-.02em}
      .line{fill:none;stroke:#2f7044;stroke-width:3.2;stroke-linecap:round;opacity:.88}
      .node{fill:url(#nodeGradient);stroke:#4f7d4a;stroke-width:3.2}
      .node-inner{fill:none;stroke:rgba(245,241,232,.36);stroke-width:1.5}
      .dot{fill:#1f3d2b;stroke:#4f7d4a;stroke-width:1.8}
      .decor{stroke:#1f3d2b;stroke-width:2.2;stroke-linecap:round;opacity:.9}
      .decor-leaf{fill:none;stroke:#4f7d4a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Decorative headings -->
  <text x="300" y="72" text-anchor="middle" class="heading">Principios Base</text>
  <line x1="120" y1="104" x2="266" y2="104" class="decor"/>
  <line x1="334" y1="104" x2="480" y2="104" class="decor"/>
  <g class="decor-leaf" transform="translate(300 103)">
    <path d="M0 10 V-16"/>
    <path d="M0 -16 C-12 -5 -11 8 0 16 C11 8 12 -5 0 -16Z"/>
    <path d="M-3 14 C-18 12 -25 2 -25 -9 C-11 -8 -3 -1 -3 14Z"/>
    <path d="M3 14 C18 12 25 2 25 -9 C11 -8 3 -1 3 14Z"/>
  </g>

  <text x="1200" y="72" text-anchor="middle" class="heading">Áreas de Acción</text>
  <line x1="1020" y1="104" x2="1166" y2="104" class="decor"/>
  <line x1="1234" y1="104" x2="1380" y2="104" class="decor"/>
  <g class="decor-leaf" transform="translate(1200 103)">
    <path d="M0 10 V-16"/>
    <path d="M0 -16 C-12 -5 -11 8 0 16 C11 8 12 -5 0 -16Z"/>
    <path d="M-3 14 C-18 12 -25 2 -25 -9 C-11 -8 -3 -1 -3 14Z"/>
    <path d="M3 14 C18 12 25 2 25 -9 C11 -8 3 -1 3 14Z"/>
  </g>

  <!-- Connectors behind nodes -->
  <path class="line" d="M500 158 C565 158 610 266 655 286"/>
  <path class="line" d="M500 245 C585 245 616 282 656 296"/>
  <path class="line" d="M500 332 C590 332 620 316 656 306"/>
  <path class="line" d="M500 419 C585 419 618 328 656 318"/>
  <path class="line" d="M500 506 C574 506 612 340 660 330"/>

  <path class="line" d="M844 286 C890 266 935 158 1000 158"/>
  <path class="line" d="M844 296 C884 282 915 245 1000 245"/>
  <path class="line" d="M844 306 C880 316 910 332 1000 332"/>
  <path class="line" d="M844 318 C882 328 915 419 1000 419"/>
  <path class="line" d="M840 330 C888 340 926 506 1000 506"/>

  <!-- Left nodes -->
  <rect class="node" x="120" y="124" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="126" y="130" width="368" height="56" rx="10"/>
  <circle class="dot" cx="507" cy="158" r="7"/>

  <rect class="node" x="120" y="211" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="126" y="217" width="368" height="56" rx="10"/>
  <circle class="dot" cx="507" cy="245" r="7"/>

  <rect class="node" x="120" y="298" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="126" y="304" width="368" height="56" rx="10"/>
  <circle class="dot" cx="507" cy="332" r="7"/>

  <rect class="node" x="120" y="385" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="126" y="391" width="368" height="56" rx="10"/>
  <circle class="dot" cx="507" cy="419" r="7"/>

  <rect class="node" x="120" y="472" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="126" y="478" width="368" height="56" rx="10"/>
  <circle class="dot" cx="507" cy="506" r="7"/>

  <text x="310" y="169" text-anchor="middle" class="node-text">Fraternidad</text>
  <text x="310" y="256" text-anchor="middle" class="node-text">Tolerancia</text>
  <text x="310" y="343" text-anchor="middle" class="node-text">Laicismo</text>
  <text x="310" y="430" text-anchor="middle" class="node-text">Libre examen</text>
  <text x="310" y="517" text-anchor="middle" class="node-text">Solidaridad social</text>

  <!-- Right nodes -->
  <rect class="node" x="1000" y="124" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="1006" y="130" width="368" height="56" rx="10"/>
  <circle class="dot" cx="993" cy="158" r="7"/>

  <rect class="node" x="1000" y="211" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="1006" y="217" width="368" height="56" rx="10"/>
  <circle class="dot" cx="993" cy="245" r="7"/>

  <rect class="node" x="1000" y="298" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="1006" y="304" width="368" height="56" rx="10"/>
  <circle class="dot" cx="993" cy="332" r="7"/>

  <rect class="node" x="1000" y="385" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="1006" y="391" width="368" height="56" rx="10"/>
  <circle class="dot" cx="993" cy="419" r="7"/>

  <rect class="node" x="1000" y="472" width="380" height="68" rx="13" filter="url(#nodeShadow)"/>
  <rect class="node-inner" x="1006" y="478" width="368" height="56" rx="10"/>
  <circle class="dot" cx="993" cy="506" r="7"/>

  <text x="1190" y="169" text-anchor="middle" class="node-text">Educación</text>
  <text x="1190" y="256" text-anchor="middle" class="node-text">Salud</text>
  <text x="1190" y="343" text-anchor="middle" class="node-text">Medio ambiente</text>
  <text x="1190" y="430" text-anchor="middle" class="node-text">Cultura y artes</text>
  <text x="1190" y="517" text-anchor="middle" class="node-text">Justicia y comunidad</text>

  <!-- Center institutional mark -->
  <circle cx="750" cy="306" r="92" fill="url(#logoGradient)" filter="url(#logoShadow)"/>
  <circle cx="750" cy="306" r="82" fill="none" stroke="#f5f1e8" stroke-width="4" opacity=".95"/>
  <circle cx="750" cy="306" r="96" fill="none" stroke="#1f3d2b" stroke-width="3" opacity=".92"/>
  <g fill="none" stroke="#f5f1e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M750 374 V242"/>
    <path d="M750 242 C722 267 723 306 750 324 C777 306 778 267 750 242Z"/>
    <path d="M745 372 C690 369 665 335 665 298 C711 302 738 324 745 372Z"/>
    <path d="M755 372 C810 369 835 335 835 298 C789 302 762 324 755 372Z"/>
    <path d="M695 351 C719 344 737 352 746 373"/>
    <path d="M805 351 C781 344 763 352 754 373"/>
    <path d="M690 380 H810"/>
  </g>
</svg>
